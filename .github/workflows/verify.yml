name: Verify

# The fast gate. It runs on everything, so it must stay cheap: no dependency
# install, no build. It answers one question — is design/ still an exact copy of
# the upstream tree, with every intentional difference declared?

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify port integrity
    runs-on: ubuntu-latest
    steps:
      - name: Keep the checkout byte-exact
        # verify-port.sh compares the bytes on disk against upstream blob ids with
        # `git hash-object --no-filters`. The root .gitattributes says `* text=auto`,
        # so a checkout that translates line endings would rewrite every text file
        # under design/ and report thousands of false differences. Linux never does
        # that, which is why this job runs here — this makes the requirement
        # explicit rather than an unstated property of the runner.
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No submodule. verify-port.sh falls back to the committed manifest of
          # upstream blob ids, which answers exactly the same question without
          # cloning a 1.7 GB object store on every push. When the submodule IS
          # present the script cross-checks the manifest against it, so the
          # shortcut cannot drift from the thing it stands in for.
          fetch-depth: 0

      - name: Verify design/ against the pinned upstream tree
        shell: bash
        run: bash scripts/verify-port.sh

      - name: Report port integrity
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          json=$(bash scripts/verify-port.sh --json 2>/dev/null | tail -1)
          if [ -z "$json" ]; then
            echo "### ❌ Port integrity" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The verifier produced no output." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          get() { printf '%s' "$json" | sed -n "s/.*\"$1\":\([0-9]*\).*/\1/p"; }
          pinned=$(printf '%s' "$json" | sed -n 's/.*"pinned":"\([^"]*\)".*/\1/p')
          gaps=$(get gaps)
          {
            if [ "${gaps:-1}" = "0" ]; then
              echo "### ✅ Port integrity — 0 gaps"
            else
              echo "### ❌ Port integrity — ${gaps} gap(s)"
            fi
            echo ""
            echo "Compared against upstream \`${pinned}\`."
            echo ""
            echo "| Measure | Count |"
            echo "|---|---:|"
            echo "| Files expected | $(get expected) |"
            echo "| Files tracked | $(get tracked) |"
            echo "| Declared differences | $(get declared) |"
            echo "| Missing | $(get missing) |"
            echo "| Bytes differ | $(get bytesDiffer) |"
            echo "| Mode mismatch | $(get modeMismatch) |"
            echo "| Blob id mismatch | $(get oidMismatch) |"
            echo "| Extra | $(get extra) |"
            echo "| Untracked | $(get untracked) |"
            echo "| Stale notices | $(get staleNotice) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Count lines
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f scripts/line-count.mjs ]; then
            echo "scripts/line-count.mjs is not present yet; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # tee, not a plain redirect: a table that exists only in the job
          # summary cannot be read back from the logs when something looks wrong.
          if ! node scripts/line-count.mjs | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The line counter failed; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Separate from the port-integrity job above so that gate stays cheap: this
    # one installs the whole workspace and compiles native modules.
    #
    # It runs on Linux deliberately. Several suites unpack macOS prebuilt
    # binaries and assert their executable bit survived, which a Windows
    # filesystem cannot represent — so the Windows release job excludes those
    # specs and this job is where they actually run. Between the two, every spec
    # runs somewhere.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: design
        timeout-minutes: 40
        env:
          OPEN_DESIGN_POSTINSTALL_CONCURRENCY: 4
        run: pnpm install --frozen-lockfile

      - name: Build the packages the tests import
        working-directory: design
        # postinstall builds the shared packages and the tools, but not the
        # desktop app — and the packaged app's tests import `@open-design/desktop/main`,
        # which is the built `dist/`, not the source. Without this the suite dies
        # with ERR_MODULE_NOT_FOUND before running a single assertion.
        run: |
          pnpm --filter @open-design/daemon run build
          pnpm --filter @open-design/desktop run build

      - name: Typecheck
        working-directory: design
        shell: bash
        # This runs HERE, on Linux, and not only in the release job, because a
        # type error is the cheapest failure in the build to find and the most
        # expensive one to find late. The web app's translation dictionary is a
        # typed interface: a component using a key that no locale declares is a
        # type error, and discovering that at the end of a forty-minute Windows
        # packaging run rather than five minutes into a Linux one wastes most of
        # an hour for a one-line cause.
        run: |
          set -euo pipefail
          pnpm -r --workspace-concurrency=4 --if-present run typecheck

      - name: Test the packages that carry product identity
        working-directory: design
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @open-design/tools-pack run test
          pnpm --filter @open-design/packaged run test
          pnpm --filter @open-design/desktop run test
