name: Verify

# This workflow records the exact Windows checkout used by a trusted run.  It is
# intentionally not a test, lint, type-check, static-analysis, accessibility, or
# release gate.  Release acceptance belongs to the packaging/publication job.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Record Windows provenance
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Bootstrap Windows CI tools
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-ci-tools.ps1

      - name: Record checkout provenance
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            throw "git could not resolve the checked-out commit"
          }
          $record = Join-Path $env:RUNNER_TEMP "material-designer-provenance.md"
          @(
            "# Windows provenance"
            ""
            "- Commit: ``$head``"
            "- Requested SHA: ``${{ github.sha }}``"
            "- Ref: ``${{ github.ref }}``"
            "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            "- Runner image: ``windows-2022``"
            "- Recorded at (UTC): ``$((Get-Date).ToUniversalTime().ToString('o'))``"
          ) | Set-Content -LiteralPath $record -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows provenance"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Commit: ``$head``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Runner image: ``windows-2022``"

      - name: Upload provenance record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: material-designer-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}\material-designer-provenance.md
          if-no-files-found: warn
          retention-days: 7
