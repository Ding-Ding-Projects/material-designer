name: Pages

# Publish the checked-in static site from the same pinned Windows image used by
# the product workflow.  This job deploys files; it does not run tests, lint,
# type checks, static analysis, accessibility checks, or screenshot gates.

on:
  push:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Bootstrap Windows CI tools
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-ci-tools.ps1

      - name: Generate and verify offline documentation bundles
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-docs-manifest.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-app-docs-manifest.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-docs-browser.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-app-docs-bundle.ps1

      - name: Fill in the newest published release facts
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          f=site/index.html
          TARGET_COMMIT=$(git rev-parse HEAD)
          resolve_tag_commit() {
            local tag="$1" ref_json object_type object_sha tag_json depth
            ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null) || return 1
            object_type=$(printf '%s' "$ref_json" | jq -r '.object.type // empty')
            object_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')
            depth=0
            while [ "$depth" -lt 4 ]; do
              if [ "$object_type" = "commit" ] && printf '%s' "$object_sha" | grep -Eq '^[0-9a-fA-F]{40}$'; then
                printf '%s' "$object_sha"
                return 0
              fi
              if [ "$object_type" != "tag" ] || ! printf '%s' "$object_sha" | grep -Eq '^[0-9a-fA-F]{40}$'; then
                return 1
              fi
              tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" 2>/dev/null) || return 1
              object_type=$(printf '%s' "$tag_json" | jq -r '.object.type // empty')
              object_sha=$(printf '%s' "$tag_json" | jq -r '.object.sha // empty')
              depth=$((depth + 1))
            done
            return 1
          }

          valid_iso_timestamp() {
            local value="$1" date_part canonical_date
            [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$ ]] || return 1
            date_part="${value:0:10}"
            canonical_date=$(date -u -d "$date_part" '+%Y-%m-%d' 2>/dev/null) || return 1
            [ "$canonical_date" = "$date_part" ] || return 1
            date -u -d "$value" '+%s' >/dev/null 2>&1
          }

          valid_semver() {
            local value="$1"
            [ -n "$value" ] && [ "${#value}" -le 128 ] || return 1
            [[ "$value" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          }

          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" 2>/dev/null | jq -s 'add') || {
            echo "::warning::could not read a published release; keeping the checked-in page facts"
            exit 0
          }

          published_releases=$(printf '%s' "$releases" | jq -c 'map(select(.draft == false and .prerelease == false and .published_at != null)) | sort_by(.published_at) | reverse')
          latest=$(printf '%s' "$published_releases" | jq -c '.[0] // empty')
          tag=$(printf '%s' "$latest" | jq -r '.tag_name // empty')
          title=$(printf '%s' "$latest" | jq -r '.name // empty')
          installer=$(printf '%s' "$latest" | jq -r '[.assets[]?.name] | map(select(endswith("setup.exe")))[0] // empty')
          bytes=$(printf '%s' "$latest" | jq -r --arg n "$installer" '[.assets[]? | select(.name==$n) | .size][0] // empty')

          if [ -z "$tag" ] || [ -z "$installer" ]; then
            echo "::warning::the newest published release has no Windows installer; keeping the checked-in page facts"
            exit 0
          fi

          codename=${title#*— }
          [ "$codename" = "$title" ] && codename="none for this build"

          version=$(printf '%s' "$installer" | sed -n 's/.*-\([0-9][0-9.]*\)-win-x64-setup\.exe/\1/p')
          [ -z "$version" ] && version="unknown"
          valid_semver "$version" || {
            echo "::warning::the published installer filename has no valid semantic version; keeping the checked-in page facts"
            exit 0
          }

          sha_dir="${RUNNER_TEMP//\\//}/pages-sha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$sha_dir"
          mkdir -p "$sha_dir"
          sha=""
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*setup.exe.sha256' --dir "$sha_dir" --clobber 2>/dev/null; then
            sha=$(cat "$sha_dir"/*.sha256 2>/dev/null | tr -d '\r' | awk '{print $1}' | head -1)
          fi
          [ -z "$sha" ] && sha="not published for this build"

          commit=$(resolve_tag_commit "$tag" 2>/dev/null || true)
          [ -z "$commit" ] && commit="unknown"
          commit=${commit:0:7}

          mb=$(( (bytes + 524288) / 1048576 ))
          chip="${version} · x64 · ${mb} MB"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${installer}"

          set_field() {
            local key=$1 value=$2 expected=${3:-1} marker count updated
            local raw_value=$value
            marker="data-release=\"$key\""
            count=$(grep -oF "$marker" "$f" | wc -l | tr -d ' ')
            if [ "$count" -ne "$expected" ]; then
              echo "::error::expected $expected visible release fields for $key, found $count"
              return 1
            fi
            value=$(printf '%s' "$value" | sed 's/[&|\\]/\\&/g')
            sed -i "s|\(data-release=\"$key\"[^>]*>\)[^<]*|\1$value|g" "$f"
            updated=$(grep -F "$marker" "$f" | grep -F ">$raw_value" | wc -l | tr -d ' ')
            if [ "$updated" -ne "$expected" ]; then
              echo "::error::release field substitution for $key changed $updated visible values, expected $expected"
              return 1
            fi
          }

          set_release_href() {
            local kind=$1 url=$2 expected=$3 marker escaped count updated
            marker="data-release-href=\"$kind\""
            count=$(grep -oF "$marker" "$f" | wc -l | tr -d ' ')
            if [ "$count" -ne "$expected" ]; then
              echo "::error::expected $expected pending release links for $kind, found $count"
              return 1
            fi
            escaped=$(printf '%s' "$url" | sed 's/[&|\\]/\\&/g')
            sed -i "/$marker/s|href=\"#\"|href=\"$escaped\"|" "$f"
            updated=$(grep -F "$marker" "$f" | grep -F "href=\"$url\"" | wc -l | tr -d ' ')
            if [ "$updated" -ne "$expected" ]; then
              echo "::error::release link substitution for $kind changed $updated links, expected $expected"
              return 1
            fi
          }

          set_front_value() {
            local source=$1 replacement=$2 expected=${3:-1} escaped_source escaped_replacement count updated
            count=$(grep -oF "$source" "$f" | wc -l | tr -d ' ')
            if [ "$count" -ne "$expected" ]; then
              echo "::error::expected $expected front-screen substitutions for $source, found $count"
              return 1
            fi
            escaped_source=$(printf '%s' "$source" | sed 's/[&|\\]/\\&/g')
            escaped_replacement=$(printf '%s' "$replacement" | sed 's/[&|\\]/\\&/g')
            sed -i "s|$escaped_source|$escaped_replacement|g" "$f"
            updated=$(grep -F "$replacement" "$f" | wc -l | tr -d ' ')
            if [ "$updated" -ne "$expected" ]; then
              echo "::error::front-screen substitution for $source did not produce $expected visible values"
              return 1
            fi
          }

          set_field tag       "$tag"
          set_field version   "$version"
          set_field commit    "$commit"
          set_field installer "$installer"
          set_field sha       "$sha"
          set_field chip      "$chip" 2

          set_field codename "$codename"

          set_release_href installer "$url" 2

          # The front-screen identity tuple is injected only when a published
          # release tag resolves to this exact deployment commit. The checked-in
          # source intentionally contains empty fields, so a deployment that
          # races release publication displays an honest unavailable state.
          front_tag=""
          while IFS= read -r candidate_tag; do
            [ -z "$candidate_tag" ] && continue
            candidate_commit=$(resolve_tag_commit "$candidate_tag" 2>/dev/null || true)
            if [ "$candidate_commit" = "$TARGET_COMMIT" ]; then
              front_tag="$candidate_tag"
              break
            fi
          done < <(printf '%s' "$published_releases" | jq -r '.[].tag_name // empty')
          if [ -n "$front_tag" ]; then
            front_dir="${RUNNER_TEMP//\\//}/front-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$front_dir"
            mkdir -p "$front_dir"
            if gh release download "$front_tag" --repo "$GITHUB_REPOSITORY" --pattern 'build-provenance.json' --dir "$front_dir" --clobber 2>/dev/null; then
              front_provenance="$front_dir/build-provenance.json"
              front_version=$(jq -r '.package.version // empty' "$front_provenance")
              front_commit=$(jq -r '.sourceCommit // empty' "$front_provenance")
              front_updated_at=$(jq -r '.builtAt // empty' "$front_provenance")
              front_provenance_status=$(jq -r '.provenanceStatus // empty' "$front_provenance")
              if valid_semver "$front_version" \
                && printf '%s' "$front_commit" | grep -Eq '^[0-9a-fA-F]{40}$' \
                && [ "$front_commit" = "$TARGET_COMMIT" ] \
                && [ "$front_version" = "$version" ] \
                && [ "$front_provenance_status" = "verified" ] \
                && valid_iso_timestamp "$front_updated_at"; then
                safe_front_version=$(printf '%s' "$front_version" | sed 's/[&|\\]/\\&/g')
                safe_front_commit=$(printf '%s' "$front_commit" | sed 's/[&|\\]/\\&/g')
                safe_front_updated_at=$(printf '%s' "$front_updated_at" | sed 's/[&|\\]/\\&/g')
                set_front_value 'data-front-version=""' "data-front-version=\"$safe_front_version\""
                set_front_value 'data-front-updated-at=""' "data-front-updated-at=\"$safe_front_updated_at\""
                set_front_value 'data-front-source-commit=""' "data-front-source-commit=\"$safe_front_commit\""
                set_front_value 'data-front-provenance-value="version">Unavailable' "data-front-provenance-value=\"version\">$safe_front_version"
                set_front_value 'data-front-provenance-value="updated-at">Unavailable' "data-front-provenance-value=\"updated-at\">$safe_front_updated_at"
                set_front_value 'data-front-provenance-value="status" role="status" aria-live="polite">Unavailable' 'data-front-provenance-value="status" role="status" aria-live="polite">Provenance verified'
                echo "Front-screen provenance refreshed from $front_tag for $TARGET_COMMIT"
              else
                echo "::warning::the matching release provenance was malformed or not bound to $GITHUB_SHA; front-screen identity remains unavailable"
              fi
            else
              echo "::warning::the matching release has no downloadable build-provenance.json; front-screen identity remains unavailable"
            fi
          else
            echo "Front-screen provenance unavailable because no published release targets $TARGET_COMMIT"
          fi

          echo "Published release facts refreshed for $tag"
          echo "  version   $version"
          echo "  code name $codename"
          echo "  commit    $commit"
          echo "  installer $installer ($mb MB)"
          echo "  sha256    ${sha:0:16}…"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
