name: Pages

# Publishes site/ to GitHub Pages.
#
# The site is plain static HTML, CSS and JavaScript with no build step, so this
# workflow uploads the directory as it is. That is deliberate: a site needing a
# toolchain to preview is a site nobody previews before publishing it.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the site is self-contained
        shell: bash
        # The site must make no network request: no CDN script, stylesheet or
        # font, no remote image, no analytics. This is a published-surface rule,
        # so it is enforced at publish time rather than trusted.
        run: |
          set -uo pipefail
          if [ ! -d site ]; then
            echo "site/ does not exist yet; nothing to deploy." >&2
            exit 1
          fi
          bad=0
          # Each check names one way a remote resource gets loaded. Ordinary
          # hyperlinks in prose (<a href="https://github.com/...">) are fine and
          # are deliberately not matched by any of these.
          check() {
            local what=$1 glob=$2 pattern=$3
            if grep -rnE "$pattern" site --include="$glob"; then
              echo "::error::site/ $what"
              bad=1
            fi
          }
          check "loads a remote script"        '*.html' '<script[^>]+src="https?://'
          check "loads a remote stylesheet"    '*.html' '<link[^>]+href="https?://'
          check "loads a remote image"         '*.html' '<(img|source)[^>]+src(set)?="https?://'
          check "imports a remote stylesheet"  '*.css'  '@import[[:space:]]*(url\()?["'"'"']?https?://'
          check "loads a remote CSS asset"     '*.css'  'url\([[:space:]]*["'"'"']?https?://'
          check "makes an external request"    '*.js'   '(fetch|XMLHttpRequest|WebSocket)[[:space:]]*\([[:space:]]*["'"'"']https?://'

          [ "$bad" -eq 0 ] || exit 1
          echo "site/ is self-contained."

      - name: Stage the dish catalogue into the site
        shell: bash
        # The catalogue lives at the repository root because the application and
        # the release workflow use it too. Only `site/` is published, so a page
        # referencing `../assets/...` would 404 for every visitor. Copying it in
        # at publish time keeps one copy in git and still gives the published
        # site a path that resolves.
        run: |
          set -euo pipefail
          if [ ! -f assets/dim-sum/index.json ]; then
            echo "::warning::no dish catalogue at assets/dim-sum — the startup surprise will not appear"
            exit 0
          fi
          mkdir -p site/assets/dim-sum
          cp -R assets/dim-sum/. site/assets/dim-sum/
          count=$(ls site/assets/dim-sum/images 2>/dev/null | wc -l)
          echo "staged $count dish image(s)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
