name: Pages

# Publish the checked-in static site from the same pinned Windows image used by
# the product workflow.  This job deploys files; it does not run tests, lint,
# type checks, static analysis, accessibility checks, or screenshot gates.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Bootstrap Windows CI tools
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-ci-tools.ps1

      - name: Fill in the newest published release facts
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          rel=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,name,assets 2>/dev/null) || {
            echo "::warning::could not read a published release; keeping the checked-in page facts"
            exit 0
          }

          tag=$(printf '%s' "$rel" | jq -r '.tagName // empty')
          title=$(printf '%s' "$rel" | jq -r '.name // empty')
          installer=$(printf '%s' "$rel" | jq -r '[.assets[].name] | map(select(endswith("setup.exe")))[0] // empty')
          bytes=$(printf '%s' "$rel" | jq -r --arg n "$installer" '[.assets[] | select(.name==$n) | .size][0] // empty')

          if [ -z "$tag" ] || [ -z "$installer" ]; then
            echo "::warning::the newest published release has no Windows installer; keeping the checked-in page facts"
            exit 0
          fi

          codename=${title#*— }
          [ "$codename" = "$title" ] && codename="none for this build"

          version=$(printf '%s' "$installer" | sed -n 's/.*-\([0-9][0-9.]*\)-win-x64-setup\.exe/\1/p')
          [ -z "$version" ] && version="unknown"

          sha_dir="${RUNNER_TEMP//\\//}/pages-sha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$sha_dir"
          mkdir -p "$sha_dir"
          sha=""
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*setup.exe.sha256' --dir "$sha_dir" --clobber 2>/dev/null; then
            sha=$(cat "$sha_dir"/*.sha256 2>/dev/null | tr -d '\r' | awk '{print $1}' | head -1)
          fi
          [ -z "$sha" ] && sha="not published for this build"

          commit=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q '.body' 2>/dev/null \
            | sed -n 's/.*Built from `\([0-9a-f]\{7,40\}\)`.*/\1/p' | head -1)
          [ -z "$commit" ] && commit="unknown"
          commit=${commit:0:7}

          mb=$(( (bytes + 524288) / 1048576 ))
          chip="${version} · x64 · ${mb} MB"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${installer}"

          f=site/index.html
          set_field() {
            local key=$1 value=$2
            value=$(printf '%s' "$value" | sed 's/[&|\\]/\\&/g')
            sed -i "s|\(data-release=\"$key\"[^>]*>\)[^<]*|\1$value|g" "$f"
          }

          set_field tag       "$tag"
          set_field version   "$version"
          set_field commit    "$commit"
          set_field installer "$installer"
          set_field sha       "$sha"
          set_field chip      "$chip"

          cn=$(printf '%s' "$codename" | sed 's/[&|\\]/\\&/g')
          sed -i "s|\(data-release=\"codename\"[^>]*>\).*\(</td>\)|\1$cn\2|g" "$f"

          esc_url=$(printf '%s' "$url" | sed 's/[&|\\]/\\&/g')
          sed -i "s|href=\"https://github.com/[^"]*/releases/download/[^"]*setup\.exe\"|href=\"$esc_url\"|g" "$f"

          echo "Published release facts refreshed for $tag"
          echo "  version   $version"
          echo "  code name $codename"
          echo "  commit    $commit"
          echo "  installer $installer ($mb MB)"
          echo "  sha256    ${sha:0:16}…"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
